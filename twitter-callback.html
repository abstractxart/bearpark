<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting Twitter - BEAR Park</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐻 Connecting Twitter Account</h1>
    <div id="spinner" class="spinner"></div>
    <div id="status"></div>
    <button id="returnBtn" style="display:none;" onclick="window.location.href='/main.html'">
      Return to BEAR Park
    </button>
  </div>

  <script>
    (async function() {
      const statusEl = document.getElementById('status');
      const spinnerEl = document.getElementById('spinner');
      const returnBtn = document.getElementById('returnBtn');

      // Parse URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');

      // Check for errors from Twitter
      if (error) {
        spinnerEl.style.display = 'none';
        statusEl.className = 'status error';
        statusEl.textContent = 'X authorization was cancelled or failed: ' + error;
        returnBtn.style.display = 'block';
        return;
      }

      if (!code) {
        spinnerEl.style.display = 'none';
        statusEl.className = 'status error';
        statusEl.textContent = 'Invalid callback - no authorization code received.';
        returnBtn.style.display = 'block';
        return;
      }

      if (!state) {
        spinnerEl.style.display = 'none';
        statusEl.className = 'status error';
        statusEl.textContent = 'Invalid callback - no state parameter received.';
        returnBtn.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/api/auth/twitter/complete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            code,
            state
          })
        });

        const result = await response.json();
        spinnerEl.style.display = 'none';

        if (response.ok && result.success) {
          const twitterUsername = result.user?.twitter_username || '';
          if (twitterUsername) {
            localStorage.setItem('twitter_connected', 'true');
            localStorage.setItem('twitter_username', twitterUsername);
          }

          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              type: 'bearpark-twitter-connected',
              success: true,
              twitter_username: twitterUsername
            }, window.location.origin);
          }

          statusEl.className = 'status success';
          statusEl.innerHTML = `
            <div style="font-size:18px; margin-bottom:8px;">✅ Success!</div>
            <div>Connected as @${twitterUsername}</div>
            <div style="margin-top:12px; font-size:14px; opacity:0.8;">This window will close automatically...</div>
          `;

          // Close popup window after 2 seconds, or redirect if not a popup
          setTimeout(() => {
            if (window.opener && !window.opener.closed) {
              // This is a popup, close it
              window.close();
            } else {
              // Not a popup, redirect to main.html
              window.location.href = '/main.html';
            }
          }, 2000);
        } else {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              type: 'bearpark-twitter-connect-failed',
              success: false,
              error: result.error || 'Failed to connect X account'
            }, window.location.origin);
          }
          statusEl.className = 'status error';
          statusEl.textContent = '❌ ' + (result.error || 'Failed to connect X account');
          returnBtn.style.display = 'block';
        }

      } catch (error) {
        spinnerEl.style.display = 'none';
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'bearpark-twitter-connect-failed',
            success: false,
            error: error.message || 'An unknown error occurred while connecting X'
          }, window.location.origin);
        }
        statusEl.className = 'status error';
        statusEl.innerHTML = `
          <div>❌ An error occurred</div>
          <div style="margin-top:8px; font-size:14px;">${error.message}</div>
        `;
        returnBtn.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
