<!doctype html>
<html lang="en">
<head>
  <!-- Fullscreen fix v2 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BEAR PONG - BEAR Park</title>
  <meta name="description" content="Play multiplayer BEAR PONG and compete on the leaderboard!" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- BROWSER COMPATIBILITY: Inline polyfills (polyfill.io blocked by some browsers) -->
  <script>
  if(typeof Promise==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8/dist/polyfill.min.js"><\/script>')}
  if(!window.fetch){document.write('<script src="https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.2/dist/fetch.umd.js"><\/script>')}
  if(!Array.from){Array.from=function(a){return[].slice.call(a)};}
  if(!Object.assign){Object.assign=function(t){for(var i=1;i<arguments.length;i++){var s=arguments[i];for(var k in s){if(Object.prototype.hasOwnProperty.call(s,k)){t[k]=s[k];}}}return t;};}
  </script>
  <script>
  (function(){
    if(!window.URLSearchParams){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/url-search-params-polyfill@8.2.0/index.js';document.head.appendChild(s);}
    if(!Element.prototype.classList){document.documentElement.className='no-classlist';}
    if(!window.requestAnimationFrame){window.requestAnimationFrame=window.webkitRequestAnimationFrame||window.mozRequestAnimationFrame||function(cb){return setTimeout(cb,16)};}
  })();
  </script>


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/park/css/launch.css" />
</head>
<body>
  <div id="loading" style="--art:url('https://pub-58cecf0785cc4738a3496a79699fdf1e.r2.dev/images/bs753i.png')">
    <div class="launch-eyebrow">BEAR Park · Bearcade</div>
    <div class="launch-title">Pong <b>Lab</b></div>
    <div class="launch-tri"></div>
    <div class="dots" aria-label="Loading Pong Lab"><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div id="access-denied" style="--art:url('https://pub-58cecf0785cc4738a3496a79699fdf1e.r2.dev/images/bs753i.png')">
    <div class="launch-eyebrow">BEAR Park · Bearcade</div>
    <div class="launch-title">Pong <b>Lab</b></div>
    <div class="launch-tri"></div>
    <p class="launch-text">Sign in to BEAR Park to play — every minute you play earns honey.</p>
    <a href="/" class="connect-button">Sign in to BEAR Park</a>
  </div>

  <!-- No iframe needed - direct redirect to game -->

  <script>
    (async function() {
      // Get wallet data from localStorage
      const walletAddress = localStorage.getItem('xaman_wallet_address');
      const displayName = localStorage.getItem('display_name');
      const twitterUsername = localStorage.getItem('twitter_username');

      // CHECK AUTHENTICATION - Block access if no wallet connected
      if (!walletAddress) {
        console.log('🔒 Access denied - No wallet connected');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('access-denied').classList.add('show');
        return; // Don't load the game
      }

      console.log('✅ Wallet authenticated - Loading game');

      // Fetch profile data (avatar URL and display name) from API
      let avatarUrl = null;
      let avatarIsAnimated = false;
      let fetchedDisplayName = displayName; // Use localStorage value as fallback
      try {
        const response = await fetch(`/api/profile/${walletAddress}`);
        const data = await response.json();

        if (data.success && data.profile) {
          // Get avatar URL and animation flag
          if (data.profile.avatar_nft) {
            try {
              // Try parsing as JSON first
              const avatarData = JSON.parse(data.profile.avatar_nft);
              avatarUrl = avatarData.imageUrl || avatarData.fallbackImageUrl || null;
              avatarIsAnimated = avatarData.isAnimated || false;
            } catch (e) {
              // If not JSON, use it directly as NFT ID
              avatarUrl = `https://nft.xrpl-labs.com/${data.profile.avatar_nft}`;
              avatarIsAnimated = false;
            }
            console.log('🖼️ Fetched avatar URL:', avatarUrl, 'isAnimated:', avatarIsAnimated);
          }

          // Get display name from API (more reliable than localStorage)
          if (data.profile.display_name) {
            fetchedDisplayName = data.profile.display_name;
            console.log('👤 Fetched display name:', fetchedDisplayName);
          }
        }
      } catch (error) {
        console.error('Failed to fetch profile:', error);
      }

      // Build game URL with authentication parameters (use production build)
      let gameUrl = '/pong/index.html';
      const params = new URLSearchParams();
      params.set('v', Date.now()); // Cache-busting parameter
      params.set('wallet', walletAddress);
      if (fetchedDisplayName) params.set('display_name', fetchedDisplayName);
      if (twitterUsername) params.set('twitter_username', twitterUsername);
      if (avatarUrl) params.set('avatar_url', avatarUrl);
      if (avatarIsAnimated) params.set('avatar_is_animated', 'true');
      gameUrl += '?' + params.toString();

      // DIRECT REDIRECT: Skip iframe, go straight to game (fixes fullscreen issue)
      console.log('🎮 Redirecting to game:', gameUrl);
      window.location.href = gameUrl;

      // Hide loading screen after timeout (in case load event doesn't fire)
      setTimeout(function() {
        document.getElementById('loading').classList.add('hidden');
      }, 5000);
    })();
  </script>
</body>
</html>
