<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flappy BEAR - BEAR Park</title>
  <meta name="description" content="Play Flappy BEAR and compete on the leaderboard!" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- BROWSER COMPATIBILITY: Inline polyfills (polyfill.io blocked by some browsers) -->
  <script>
  if(typeof Promise==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8/dist/polyfill.min.js"><\/script>')}
  if(!window.fetch){document.write('<script src="https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.2/dist/fetch.umd.js"><\/script>')}
  if(!Array.from){Array.from=function(a){return[].slice.call(a)};}
  if(!Object.assign){Object.assign=function(t){for(var i=1;i<arguments.length;i++){var s=arguments[i];for(var k in s){if(Object.prototype.hasOwnProperty.call(s,k)){t[k]=s[k];}}}return t;};}
  </script>
  <script>
  (function(){
    if(!window.URLSearchParams){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/url-search-params-polyfill@8.2.0/index.js';document.head.appendChild(s);}
    if(!Element.prototype.classList){document.documentElement.className='no-classlist';}
    if(!window.requestAnimationFrame){window.requestAnimationFrame=window.webkitRequestAnimationFrame||window.mozRequestAnimationFrame||function(cb){return setTimeout(cb,16)};}
  })();
  </script>


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/park/css/launch.css" />
</head>
<body>
  <div id="loading" style="--art:url('https://pub-58cecf0785cc4738a3496a79699fdf1e.r2.dev/images/8k133u.png')">
    <div class="launch-eyebrow">BEAR Park · Bearcade</div>
    <div class="launch-title">Flappy <b>BEAR</b></div>
    <div class="launch-tri"></div>
    <div class="dots" aria-label="Loading Flappy BEAR"><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div id="access-denied" style="--art:url('https://pub-58cecf0785cc4738a3496a79699fdf1e.r2.dev/images/8k133u.png')">
    <div class="launch-eyebrow">BEAR Park · Bearcade</div>
    <div class="launch-title">Flappy <b>BEAR</b></div>
    <div class="launch-tri"></div>
    <p class="launch-text">Sign in to BEAR Park to play — every minute you play earns honey.</p>
    <a href="/" class="connect-button">Sign in to BEAR Park</a>
  </div>

  <iframe id="game-frame" allow="autoplay; fullscreen"></iframe>

  <script>
    (function() {
      // Get wallet data from localStorage
      const walletAddress = localStorage.getItem('xaman_wallet_address');
      const displayName = localStorage.getItem('display_name');
      const twitterUsername = localStorage.getItem('twitter_username');

      // CHECK AUTHENTICATION - Block access if no wallet connected
      if (!walletAddress) {
        console.log('🔒 Access denied - No wallet connected');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('access-denied').classList.add('show');
        return; // Don't load the game
      }

      console.log('✅ Wallet authenticated - Loading game');

      // Build game URL with authentication parameters (use local game build)
      let gameUrl = '/frontend/flappy-bear/index.html';
      const params = new URLSearchParams();
      params.set('wallet', walletAddress);
      if (displayName) params.set('display_name', displayName);
      if (twitterUsername) params.set('twitter_username', twitterUsername);
      gameUrl += '?' + params.toString();

      // Set iframe source
      const iframe = document.getElementById('game-frame');
      iframe.src = gameUrl;

      // Hide loading screen when iframe loads
      iframe.addEventListener('load', function() {
        // Keys go to the focused document: without this, SPACE does nothing
        // (and the game's tab never counts as focused for honey) until the
        // player clicks into the game once.
        try { iframe.contentWindow.focus(); } catch (e) { /* same origin; never expected */ }
        setTimeout(function() {
          document.getElementById('loading').classList.add('hidden');
        }, 500);
      });

      // Hide loading screen after timeout (in case load event doesn't fire)
      setTimeout(function() {
        document.getElementById('loading').classList.add('hidden');
      }, 5000);
    })();
  </script>
</body>
</html>
